[project]
name = "splitflap-cad"
version = "0.0.0"
description = "Code-first CAD for the modular split-flap (build123d)."
requires-python = ">=3.12,<3.13"   # cadquery-ocp wheels lag newest Python; pin 3.12
dependencies = [
    "build123d==0.11.1",  # pre-1.0 API churn — pin exact, bump deliberately
    # Proper involute bevel pairs; Git tag because py_gearworks is not
    # published on PyPI yet. Pin it just as tightly as build123d.
    "py-gearworks @ git+https://github.com/GarryBGoode/py_gearworks@v0.0.18",
    "ocp-vscode>=2.8.0",  # browser/VS Code live viewer (port 3939)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.9",  # 2D deliverable drawings (layout / section PNGs), not geometry
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["splitflap_cad", "blinds_cad", "nas_cad", "flatbed_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# slow = XOR-vs-golden-BREP + full catalog builds; run with `pytest -m slow`
markers = ["slow: heavy geometry checks (golden XOR, full catalog builds)"]
addopts = "-m 'not slow'"
